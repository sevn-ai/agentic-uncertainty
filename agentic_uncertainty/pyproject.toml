[project]
name = "agentic-uncertainty"
version = "0.1.0"
description = "Experiments for agentic uncertainty estimation on SWE-bench Pro"
readme = "README.md"
authors = [
    { name = "Jean Kaddour", email = "jean.kaddour@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "litellm>=1.0.0",
    "google-genai[aiohttp]>=1.0.0",
    "datasets>=2.14.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "modal>=0.64.0",
    "tenacity>=8.0.0",
    "mini-swe-agent @ {root:uri}/../SWE-bench_Pro-os/mini-swe-agent",
]

[project.optional-dependencies]
docker = ["docker"]

[project.scripts]
# Unified experiment runner
run-experiment = "agentic_uncertainty.scripts.experiments.run:main"
run-online = "agentic_uncertainty.scripts.experiments.online:main"
analyze-mid-execution = "agentic_uncertainty.scripts.analysis.analyze_mid_execution:main"
evaluate-patches = "agentic_uncertainty.scripts.evaluate_patches:main"
generate-trajectories = "agentic_uncertainty.scripts.generate_trajectories:main"

# Analysis
generate-tables = "agentic_uncertainty.scripts.analysis.generate_tables:main"
generate-paper-figures = "agentic_uncertainty.scripts.analysis.generate_paper_figures:main"
analyze-false-commitment = "agentic_uncertainty.scripts.analysis.false_commitment:main"
evaluate-cache = "agentic_uncertainty.scripts.analysis.evaluate_cache:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_uncertainty"]

[tool.hatch.build.targets.sdist]
